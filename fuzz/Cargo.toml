[package]
name = "xboot-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
xboot-core = { path = "../crates/xboot-core" }
tempfile = "3"

[[bin]]
name = "vhd_footer"
path = "fuzz_targets/vhd_footer.rs"
test = false
doc = false

[[bin]]
name = "open_backing"
path = "fuzz_targets/open_backing.rs"
test = false
doc = false

[[bin]]
name = "iscsi_pdu"
path = "fuzz_targets/iscsi_pdu.rs"
test = false
doc = false
